<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin · Yayasan Ananta Karuna Bahagia</title>
<link rel="icon" type="image/png" href="/assets/img/logo-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --g-950:#06331b; --g-900:#0a4526; --g-800:#0b5e31; --g-700:#11753d; --g-600:#1f8f45; --g-500:#3fa34d;
  --lime:#8dc63f; --lime-100:#eef7df; --lime-300:#c3e58f; --navy:#1b365d;
  --bg:#f4f7f1; --paper:#fff; --ink:#13201a; --body:#33443a; --muted:#6b7b70; --line:#e2eadb;
  --red:#c0392b; --red-bg:#fdecea; --amber:#8a5a00; --amber-bg:#fff6e0;
  --radius:16px; --shadow:0 1px 2px rgba(10,40,20,.06),0 6px 18px rgba(10,40,20,.06);
}
*{box-sizing:border-box}
body{margin:0;font-family:"Plus Jakarta Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{color:var(--ink);margin:0 0 .4em;line-height:1.2;letter-spacing:-.01em}
h1{font-size:1.6rem}h2{font-size:1.2rem}
a{color:var(--g-700)}
button,input,select,textarea{font:inherit}
.icon{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
[hidden]{display:none !important}

/* tombol */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:12px;border:0;font-weight:700;cursor:pointer;text-decoration:none;font-size:.93rem;line-height:1.2;transition:background .15s, box-shadow .15s, opacity .15s}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-primary{background:var(--g-700);color:#fff}
.btn-primary:hover:not(:disabled){background:var(--g-800)}
.btn-ghost{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn-ghost:hover:not(:disabled){box-shadow:inset 0 0 0 1.5px var(--g-500)}
.btn-danger{background:var(--red-bg);color:var(--red)}
.btn-danger:hover:not(:disabled){background:#f9d6d2}
.btn-sm{padding:8px 12px;font-size:.85rem;border-radius:10px}
.btn-block{width:100%}
.link{background:none;border:0;color:var(--g-700);font-weight:700;cursor:pointer;padding:0}

/* form */
label.lbl{display:block;font-weight:700;color:var(--ink);font-size:.88rem;margin:16px 0 6px}
.hint{font-size:.8rem;color:var(--muted);margin-top:5px}
.field{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);transition:border-color .15s, box-shadow .15s}
.field:focus{outline:0;border-color:var(--g-500);box-shadow:0 0 0 4px rgba(63,163,77,.15)}
textarea.field{resize:vertical;min-height:90px}
textarea.story{min-height:260px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 16px}
.money{position:relative}.money span{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:700}
.money .field{padding-left:40px;font-weight:700}
.pw{position:relative}.pw .field{padding-right:46px}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;padding:8px;cursor:pointer;color:var(--muted)}
.alert{border-radius:12px;padding:11px 14px;font-size:.88rem;margin:14px 0 0}
.alert.err{background:var(--red-bg);color:var(--red)}
.alert.ok{background:var(--lime-100);color:var(--g-800)}
.alert.warn{background:var(--amber-bg);color:var(--amber)}
.counter{float:right;font-weight:600;color:var(--muted);font-size:.78rem}

/* switch */
.switch{position:relative;display:inline-block;width:46px;height:26px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:#cfd8cb;border-radius:99px;cursor:pointer;transition:.2s}
.switch span::before{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch input:checked+span{background:var(--g-600)}
.switch input:checked+span::before{transform:translateX(20px)}
.switch input:focus-visible+span{box-shadow:0 0 0 3px rgba(63,163,77,.35)}

/* auth */
.auth{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(circle at 20% 0%,#e3f2d2,transparent 50%),var(--bg)}
.auth-card{width:100%;max-width:400px;background:#fff;border-radius:22px;box-shadow:0 20px 50px rgba(6,51,27,.12);padding:32px 28px}
.auth-card .logo{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.auth-card .logo img{width:48px}
.auth-card .logo b{display:block;color:var(--navy);letter-spacing:.06em;line-height:1}
.auth-card .logo small{display:block;color:var(--g-600);font-size:.62rem;font-weight:700;letter-spacing:.2em;margin-top:3px}
.auth-card p.sub{color:var(--muted);margin:0 0 4px;font-size:.9rem}
.auth-foot{margin-top:18px;display:flex;justify-content:space-between;align-items:center;font-size:.88rem}
.codebox{font-family:ui-monospace,Consolas,monospace;font-size:1.25rem;font-weight:800;letter-spacing:.06em;background:var(--lime-100);color:var(--g-900);border:2px dashed var(--g-500);border-radius:14px;padding:16px;text-align:center;margin:12px 0;word-break:break-all}

/* shell */
.top{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line);height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;gap:12px}
.top .brand{display:flex;align-items:center;gap:10px;font-weight:800;color:var(--ink);text-decoration:none}
.top .brand img{width:38px}
.top .brand span small{display:block;font-size:.72rem;color:var(--muted);font-weight:600}
.top .user{display:flex;align-items:center;gap:10px;font-size:.88rem}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--g-700);color:#fff;display:grid;place-items:center;font-weight:800;font-size:.8rem}
.shell{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 62px)}
.side{background:#fff;border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:62px;height:calc(100vh - 62px);overflow:auto}
.side .grp{font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:14px 10px 6px}
.nav{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;padding:10px 12px;border-radius:10px;cursor:pointer;color:var(--body);font-weight:600;text-decoration:none;font-size:.93rem}
.nav:hover{background:var(--bg)}
.nav.on{background:var(--lime-100);color:var(--g-800)}
main.content{padding:28px 32px 60px;max-width:1100px;width:100%}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.head p{margin:0;color:var(--muted)}
.card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:22px}
.card+.card{margin-top:18px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.stat{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.stat small{color:var(--muted);font-weight:600;font-size:.8rem}
.stat b{display:block;font-size:1.5rem;color:var(--ink);margin-top:4px;line-height:1.2;word-break:break-word}
.stat i{font-style:normal;font-size:.8rem;color:var(--g-600);font-weight:600}

/* daftar campaign */
.clist{display:flex;flex-direction:column;gap:12px}
.citem{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;display:grid;grid-template-columns:96px 1fr auto;gap:16px;align-items:center}
.citem img{width:96px;height:72px;object-fit:cover;border-radius:10px;background:var(--bg)}
.citem h3{font-size:1rem;margin:0 0 2px}
.citem .meta{font-size:.8rem;color:var(--muted)}
.tag{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--lime-100);color:var(--g-800);margin-right:6px}
.tag.off{background:#eef0ed;color:var(--muted)}
.bar{height:8px;background:#e8eee4;border-radius:99px;overflow:hidden;margin:8px 0 4px;max-width:420px}
.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--g-600),var(--lime));border-radius:99px}
.cact{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.cact .tg{display:flex;align-items:center;gap:8px;font-size:.82rem;font-weight:600;color:var(--muted);margin-right:6px}
.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty .icon{width:42px;height:42px;color:var(--lime);margin-bottom:8px}

/* form campaign */
.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.ph{position:relative;aspect-ratio:4/3;border-radius:12px;overflow:hidden;background:var(--bg);border:1.5px solid var(--line)}
.ph img{width:100%;height:100%;object-fit:cover}
.ph .cover{position:absolute;left:6px;top:6px;background:var(--g-700);color:#fff;font-size:.68rem;font-weight:800;padding:2px 8px;border-radius:99px}
.ph .tools{position:absolute;inset:auto 0 0 0;display:flex;justify-content:space-between;padding:6px;background:linear-gradient(transparent,rgba(0,0,0,.55))}
.ph .tools button{width:30px;height:30px;border-radius:8px;border:0;background:rgba(255,255,255,.92);cursor:pointer;display:grid;place-items:center;color:var(--ink)}
.ph .tools button:disabled{opacity:.35;cursor:default}
.ph .tools .rm{color:var(--red)}
.ph.add{border-style:dashed;display:grid;place-items:center;cursor:pointer;color:var(--g-700);font-weight:700;font-size:.85rem;text-align:center;padding:8px;background:#fff}
.ph.add:hover{border-color:var(--g-500);background:var(--lime-100)}
.ph.busy::after{content:"Mengunggah…";position:absolute;inset:0;background:rgba(255,255,255,.8);display:grid;place-items:center;font-weight:700;color:var(--g-700);font-size:.85rem}
.form-foot{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:18px 0 4px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.vis{display:flex;align-items:center;gap:12px;padding:14px;border-radius:12px;background:var(--bg);margin-top:16px}
.vis b{display:block;color:var(--ink)}
.vis small{color:var(--muted)}

/* tabel admin */
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
td .acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}

/* tab edit campaign */
.etabs{display:flex;gap:4px;border-bottom:1.5px solid var(--line);margin:0 0 18px;overflow-x:auto}
.etab{border:0;background:none;padding:11px 14px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1.5px;white-space:nowrap;font-size:.92rem}
.etab:hover{color:var(--ink)}
.etab.on{color:var(--g-700);border-bottom-color:var(--g-700)}
.etab .cnt{font-weight:600}
/* editor cerita */
.ed{border:1.5px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}
.ed:focus-within{border-color:var(--g-500);box-shadow:0 0 0 4px rgba(63,163,77,.12)}
.ed-tools{display:flex;flex-wrap:wrap;gap:4px;padding:8px;background:var(--bg);border-bottom:1px solid var(--line);position:sticky;top:62px;z-index:2}
.ed-tools button{display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;background:#fff;border-radius:8px;padding:7px 11px;cursor:pointer;font-size:.88rem;color:var(--ink);min-width:36px;justify-content:center}
.ed-tools button:hover{border-color:var(--g-500)}
.ed-tools .ed-sp{flex:1}
.ed-tools .ed-word{background:var(--lime-100);color:var(--g-800);font-weight:700}
.ed-area{min-height:320px;padding:18px 20px;outline:0;font-size:1rem;line-height:1.75;color:var(--body);max-height:70vh;overflow:auto}
.ed-area:empty::before{content:attr(data-ph);color:var(--muted)}
.ed-area p{margin:0 0 .9em}
.ed-area h3{font-size:1.15rem;margin:1.2em 0 .5em}
.ed-area blockquote{margin:0 0 1em;padding:10px 16px;border-left:4px solid var(--lime);background:var(--lime-100);border-radius:0 10px 10px 0;font-style:italic}
.ed-area img{max-width:100%;height:auto;border-radius:12px;display:block;margin:6px auto}
.ed-area img:hover{outline:3px solid var(--lime-300)}
.ed-area ul,.ed-area ol{padding-left:1.4em;margin:0 0 1em}
.ed-status{padding:8px 14px;background:var(--amber-bg);color:var(--amber);font-size:.85rem;font-weight:600}
/* catatan donasi/kabar/pencairan */
.rec{display:flex;gap:14px;align-items:flex-start;padding:14px;border:1px solid var(--line);border-radius:14px}
.rec img{width:88px;height:66px;object-fit:cover;border-radius:10px;flex:none}
.rec h3{font-size:1rem;margin:2px 0}
.rec .meta{font-size:.78rem;color:var(--muted);font-weight:600}
.rec .acts{display:flex;gap:6px;flex:none}
.clip{max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clip2{margin:0;color:var(--body);font-size:.9rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.one-img{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.one-img img{max-width:100%;max-height:180px;border-radius:12px}
.check input{width:18px;height:18px;accent-color:var(--g-700)}

/* modal & toast */
.modal{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(6,30,16,.5)}
.modal-box{background:#fff;border-radius:20px;width:100%;max-width:460px;max-height:calc(100vh - 32px);overflow:auto;padding:24px;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.modal-box .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:99px;font-weight:600;font-size:.9rem;opacity:0;pointer-events:none;transition:all .25s;z-index:200;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.loading{display:grid;place-items:center;min-height:50vh;color:var(--muted);font-weight:600}

/* responsif */
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{position:sticky;top:62px;height:auto;z-index:20;display:flex;gap:4px;overflow-x:auto;padding:8px 12px;border-right:0;border-bottom:1px solid var(--line)}
  .side .grp{display:none}
  .nav{white-space:nowrap;width:auto;padding:9px 12px}
  main.content{padding:20px 16px 60px}
  .stats{grid-template-columns:1fr 1fr}
  .citem{grid-template-columns:80px 1fr}
  .citem img{width:80px;height:64px}
  .cact{grid-column:1 / -1;justify-content:flex-start}
  .photos{grid-template-columns:1fr 1fr}
  .ed-tools{top:118px}
  .rec{flex-wrap:wrap}
  .rec .acts{width:100%}
  .clip{max-width:100%;white-space:normal}
  .top .user .uname{display:none}
}
@media (max-width:560px){
  .row2,.row3{grid-template-columns:1fr}
  .top{padding:0 14px}
  .top .brand span small{display:none}
  table thead{display:none}
  table tr{display:block;border-bottom:1px solid var(--line);padding:10px 0}
  table td{display:block;border:0;padding:3px 0}
  td .acts{justify-content:flex-start;margin-top:6px}
  .auth-card{padding:26px 20px}
}
</style>
</head>

<script>
(function(){
'use strict';
var CATEGORIES = ['Kesehatan','Air Bersih','Pendidikan','Sosial','Kemanusiaan','Keagamaan','Ekonomi','Bencana','Umum'];
var app = document.getElementById('app');
var state = { me: null, view: 'dashboard', editing: null };

/* ---------- util ---------- */
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function rp(n){ return 'Rp' + Number(n || 0).toLocaleString('id-ID'); }
function num(v){ return Number(String(v || '').replace(/[^\d]/g, '')) || 0; }
function pct(c){ return c.target > 0 ? Math.min(100, Math.round(c.collected / c.target * 100)) : 0; }
function fmtDate(s){ if (!s) return '-'; var d = new Date(s); return isNaN(d) ? '-' : d.toLocaleDateString('id-ID', { day:'numeric', month:'short', year:'numeric' }); }
function ic(id){ return '<svg class="icon"><use href="#i-' + id + '"/></svg>'; }
var toastT;
function toast(msg){ var t = document.getElementById('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(function(){ t.classList.remove('on'); }, 2600); }
function copy(text){
  function fb(){ var ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); toast('Disalin'); } catch(e){} document.body.removeChild(ta); }
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function(){ toast('Disalin'); }, fb); else fb();
}

/* ---------- API ---------- */
function api(path, action, opts){
  opts = opts || {};
  if (window.__AKB_MOCK__) return window.__AKB_MOCK__(path, action, opts);
  var url = '/api/' + path + '?action=' + encodeURIComponent(action) + (opts.query || '');
  var init = { method: opts.body ? 'POST' : 'GET', credentials: 'same-origin', headers: { 'Accept': 'application/json' } };
  if (opts.body) { init.headers['Content-Type'] = 'application/json'; init.headers['X-AKB'] = '1'; init.body = JSON.stringify(opts.body); }
  return fetch(url, init).then(function(r){
    return r.json().catch(function(){ return { ok:false, error: 'Server tidak merespons dengan benar (kode ' + r.status + ').' }; }).then(function(d){
      if (r.status === 401 && path === 'admin') { state.me = null; renderLogin('Sesi berakhir. Silakan login kembali.'); throw new Error('401'); }
      if (!r.ok || !d.ok) throw new Error(d.error || ('Gagal (kode ' + r.status + ').'));
      return d;
    });
  }, function(){ throw new Error('Tidak dapat terhubung ke server. Periksa koneksi internet.'); });
}
function busy(btn, on, text){
  if (!btn) return;
  if (on) { btn.dataset.t = btn.innerHTML; btn.disabled = true; btn.textContent = text || 'Memproses…'; }
  else { btn.disabled = false; if (btn.dataset.t) btn.innerHTML = btn.dataset.t; }

/* ---------- modal ---------- */
function modal(html, onMount){
  var m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = '<div class="modal-box" role="dialog" aria-modal="true">' + html + '</div>';
  document.body.appendChild(m);
  function close(){ m.remove(); document.removeEventListener('keydown', key); }
  function key(e){ if (e.key === 'Escape') close(); }
  document.addEventListener('keydown', key);
  m.addEventListener('click', function(e){ if (e.target === m || e.target.closest('[data-close]')) close(); });
  if (onMount) onMount(m.firstChild, close);
  var f = m.querySelector('input,button'); if (f) setTimeout(function(){ f.focus(); }, 30);
  return close;
}
function confirmBox(title, text, okText, danger){

      function(box, close){

        box.parentNode.addEventListener('click', function(e){ if (e.target.closest('[data-close]') || e.target === box.parentNode) resolve(false); });

// Pembersih HTML di browser (sama aturannya dengan server).
var EDITOR_TAGS = { P:'p', BR:'br', STRONG:'strong', B:'strong', EM:'em', I:'em', U:'u', H1:'h3', H2:'h3', H3:'h3', H4:'h3', BLOCKQUOTE:'blockquote', UL:'ul', OL:'ol', LI:'li', IMG:'img', FIGURE:'figure', FIGCAPTION:'figcaption', DIV:'p' };
function okImgSrc(src, allowData){
  return /^https:\/\/[a-z0-9.-]+\.public\.blob\.vercel-storage\.com\//i.test(src) || /^\/assets\/img\/campaign\/[a-z0-9._-]+\.(webp|jpe?g|png)$/i.test(src) ||
    (allowData && /^data:image\/(png|jpe?g|webp|gif|bmp)/i.test(src)) || (location.hostname === 'localhost' && /^(data:image|\/assets\/)/.test(src));
}
function cleanHtml(html, allowData){
  var doc = new DOMParser().parseFromString('<div>' + String(html || '') + '</div>', 'text/html');
  function walk(node){
    var out = '';
    node.childNodes.forEach(function(n){
      if (n.nodeType === 3) { out += esc(n.nodeValue.replace(/ /g, ' ')); return; }
      if (n.nodeType !== 1) return;
      var t = EDITOR_TAGS[n.tagName];
      if (/^(SCRIPT|STYLE|IFRAME|OBJECT|EMBED|SVG|MATH|TEMPLATE|NOSCRIPT)$/.test(n.tagName)) return;
      if (!t) { out += walk(n); return; }
      if (t === 'br') { out += '<br>'; return; }
      if (t === 'img') { var s = n.getAttribute('src') || ''; if (okImgSrc(s, allowData)) out += '<img src="' + esc(s) + '" alt="' + esc((n.getAttribute('alt') || '').slice(0, 200)) + '">'; return; }
      var inner = walk(n);
      if (t === 'p' && !inner.replace(/<br>/g, '').trim()) { out += '<p><br></p>'; return; }
      out += '<' + t + '>' + inner + '</' + t + '>';
    });
    return out;
  }
  return walk(doc.body.firstChild).replace(/(<p><br><\/p>){2,}/g, '<p><br></p>');
}
function dataUrlToFile(u, name){
  var m = /^data:([^;]+);base64,(.*)$/.exec(u); if (!m) return null;
  var bin = atob(m[2]), arr = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new File([arr], name || 'foto', { type: m[1] });
}

  try { document.execCommand('defaultParagraphSeparator', false, 'p'); } catch (e) {}
  function setStatus(msg){ status.hidden = !msg; status.textContent = msg || ''; }
  function saveRange(){ var s = window.getSelection(); if (s.rangeCount && area.contains(s.anchorNode)) savedRange = s.getRangeAt(0).cloneRange(); }
  function restoreRange(){ area.focus(); var s = window.getSelection(); s.removeAllRanges(); if (savedRange) s.addRange(savedRange); else { var r = document.createRange(); r.selectNodeContents(area); r.collapse(false); s.addRange(r); } }

    files.reduce(function(p, f){
      return p.then(function(){
        busyCount++; setStatus('Mengunggah foto…');
        return uploadFile(f).then(function(url){ restoreRange(); document.execCommand('insertHTML', false, '<p><img src="' + esc(url) + '" alt=""></p><p><br></p>'); saveRange(); })
          .catch(function(x){ if (x.message !== '401') toast('Gagal mengunggah ' + f.name + ': ' + x.message); })
          .then(function(){ busyCount--; if (!busyCount) setStatus(''); });
      });
    }, Promise.resolve());
  });
  docIn.addEventListener('change', function(){
    var f = docIn.files && docIn.files[0]; docIn.value = '';
    if (!f) return;
    if (!/\.docx$/i.test(f.name)) return toast('Pilih file Word berformat .docx (bukan .doc lama).');
    var go = !area.textContent.trim() && !area.querySelector('img') ? Promise.resolve(true) :
      confirmBox('Ganti isi cerita?', 'Isi cerita yang sekarang akan diganti dengan isi file "' + f.name + '".', 'Ya, ganti');
    go.then(function(yes){
      if (!yes) return;
      busyCount++; setStatus('Membaca file Word…');
      Promise.all([loadMammoth(), f.arrayBuffer()]).then(function(r){
        return r[0].convertToHtml({ arrayBuffer: r[1] });
      }).then(function(result){
        var tmp = document.createElement('div'); tmp.innerHTML = cleanHtml(result.value, true);
        // Paragraf pertama dipakai sebagai judul / deskripsi jika masih kosong
        if (opts && opts.onFirstText) opts.onFirstText(tmp);
        var imgs = Array.prototype.slice.call(tmp.querySelectorAll('img'));
        var n = 0;
        return imgs.reduce(function(p, im, i){
          return p.then(function(){
            setStatus('Mengunggah foto ' + (i + 1) + ' dari ' + imgs.length + '…');
            var file = dataUrlToFile(im.getAttribute('src'), 'word-' + (i + 1));
            if (!file) { im.remove(); return; }
            return uploadFile(file).then(function(url){ im.setAttribute('src', url); n++; }).catch(function(x){ im.remove(); if (x.message !== '401') toast('Satu foto dari Word dilewati: ' + x.message); });
          });
        }, Promise.resolve()).then(function(){
          area.innerHTML = cleanHtml(tmp.innerHTML, false);
          toast('Isi Word dimasukkan' + (imgs.length ? ' (' + n + ' foto)' : '') + '. Periksa lalu klik Simpan.');
        });
      }).catch(function(x){ if (x.message !== '401') toast(x.message || 'Gagal membaca file Word.'); })
        .then(function(){ busyCount--; setStatus(''); });
    });
  });
  return {
    getHtml: function(){ return cleanHtml(area.innerHTML, false); },
    isBusy: function(){ return busyCount > 0; }
  };
}

function singleImageField(host, url){
  var cur = url || '', busyUp = false;
  function draw(){
    host.innerHTML = cur
      ? '<div class="one-img"><img src="' + esc(cur) + '" alt=""><button type="button" class="btn btn-danger btn-sm" data-rm>' + ic('trash') + ' Hapus foto</button></div>'
      : '<button type="button" class="ph add" style="aspect-ratio:auto;height:110px;width:100%" data-add>' + ic('img') + '<br>' + (busyUp ? 'Mengunggah…' : 'Pilih foto (opsional)') + '</button>';
    var rm = host.querySelector('[data-rm]'); if (rm) rm.onclick = function(){ cur = ''; draw(); };
    var add = host.querySelector('[data-add]'); if (add) add.onclick = function(){ inp.click(); };
  }
  var inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/jpeg,image/png,image/webp'; inp.hidden = true; host.after(inp);
  inp.onchange = function(){ var f = inp.files[0]; inp.value = ''; if (!f) return; busyUp = true; draw();
    uploadFile(f).then(function(u){ cur = u; }).catch(function(x){ if (x.message !== '401') toast(x.message); }).then(function(){ busyUp = false; draw(); }); };
  draw();
  return { get: function(){ return cur; }, busy: function(){ return busyUp; } };
}

function formCampaign(v, c, tab){
  var images = (c.images || []).slice();
  var uploading = 0;
  tab = c.id ? (tab || 'info') : 'info';

  v.innerHTML =
    '<div class="head"><div><button class="link" id="back">← Kembali</button><h1 style="margin-top:8px">' + (c.id ? esc(c.title) : 'Campaign Baru') + '</h1></div>' +
    (c.id && c.visible ? '<a class="btn btn-ghost btn-sm" href="/campaign/' + esc(c.slug) + '" target="_blank" rel="noopener">' + ic('ext') + ' Lihat di website</a>' : '') + '</div>' +
    (c.id ? '<div class="etabs" role="tablist">' + tabs.map(function(t){ return '<button type="button" class="etab" data-tab="' + t[0] + '" role="tab">' + t[1] + '<span class="cnt" data-cnt="' + t[0] + '"></span></button>'; }).join('') + '</div>'
          : '<div class="alert warn" style="margin:0 0 16px">Simpan campaign dulu. Setelah tersimpan, tab <b>Catat Donasi</b>, <b>Kabar Terbaru</b>, dan <b>Pencairan</b> akan muncul.</div>') +
    '<div data-panel="info"><form id="cForm" novalidate>' +
    '<div class="card"><h2>Informasi Campaign</h2>' +
    '<label class="lbl" for="cTitle">Judul campaign</label><input class="field" id="cTitle" maxlength="160" value="' + esc(c.title) + '" placeholder="Contoh: Sumur Bor untuk Desa Terpencil">' +
    '<div class="row2"><div><label class="lbl" for="cCat">Kategori</label><select class="field" id="cCat">' +
    CATEGORIES.map(function(k){ return '<option' + (k === c.category ? ' selected' : '') + '>' + k + '</option>'; }).join('') + '</select></div>' +
    '<div><label class="lbl" for="cSort">Urutan tampil</label><input class="field" id="cSort" type="number" value="' + (c.sort || 0) + '"><div class="hint">Angka lebih kecil tampil lebih dulu.</div></div></div>' +
    '<label class="lbl" for="cSum">Deskripsi singkat <span class="counter" id="sumCount"></span></label><textarea class="field" id="cSum" maxlength="240" placeholder="1–2 kalimat yang tampil di kartu campaign halaman depan.">' + esc(c.summary) + '</textarea>' +
    '<div class="row2"><div><label class="lbl" for="cTarget">Target dana</label>' + moneyInput('cTarget', c.target) + '</div>' +
    '<div><label class="lbl" for="cDead">Batas waktu <span style="font-weight:500;color:var(--muted)">(opsional)</span></label><input class="field" id="cDead" type="date" value="' + esc(c.deadline || '') + '"></div></div>' +
    (c.id ? '<div class="hint" style="margin-top:10px">Dana terkumpul <b>' + rp(c.collected) + '</b> dari ' + Number(c.donors || 0).toLocaleString('id-ID') + ' donatur. Dihitung otomatis dari tab <b>Catat Donasi</b>.</div>' : '') +
    '<label class="vis"><span class="switch"><input type="checkbox" id="cVis" ' + (c.visible ? 'checked' : '') + '><span></span></span><span><b>Tampilkan di website</b><small>Matikan jika campaign masih draf atau sudah selesai.</small></span></label></div>' +

    '<div class="card"><h2>Foto Banner <span style="font-weight:600;color:var(--muted);font-size:.85rem">(1–4 foto, bisa digeser di website)</span></h2>' +
    '<p class="hint" style="margin:0 0 12px">Foto pertama menjadi sampul di kartu halaman depan. Ukuran ideal lanskap 16:9 (misalnya 1280×720).</p>' +
    '<div class="photos" id="photos"></div><input type="file" id="fileIn" accept="image/jpeg,image/png,image/webp" multiple hidden></div>' +

    '<div class="card"><h2>Cerita Lengkap</h2>' +
    '<p class="hint" style="margin:0 0 12px">Bisa diketik langsung, ditempel dari Word, atau klik <b>Impor dari Word</b>: teks, huruf tebal/miring, dan foto di tengah tulisan ikut masuk otomatis.</p>' +
    '<div id="edHost"></div></div>' +

    '<div id="cErr" class="alert err" hidden></div>' +
    '<div class="form-foot"><button type="button" class="btn btn-ghost" id="cancel">Batal</button><button class="btn btn-primary" id="save">Simpan Campaign</button></div></form></div>' +
    '<div data-panel="donasi" hidden></div><div data-panel="kabar" hidden></div><div data-panel="cair" hidden></div>';

  var sum = document.getElementById('cSum'), cnt = document.getElementById('sumCount');
  function upd(){ cnt.textContent = sum.value.length + '/240'; }
  sum.oninput = upd; upd();
  bindMoney(v);
  document.getElementById('back').onclick = document.getElementById('cancel').onclick = function(){ go('campaigns'); };

  var editor = makeEditor(document.getElementById('edHost'), c.story_html || textToHtml(c.story), {
    onFirstText: function(tmp){
      var t = document.getElementById('cTitle');
      var first = tmp.querySelector('h3, p');
      if (first && !t.value.trim()) {
        var txt = first.textContent.trim();
        if (txt.length >= 5 && txt.length <= 220) { t.value = txt.length > 160 ? txt.slice(0, 159).replace(/\s+\S*$/, '') : txt; first.remove(); }
      }
      if (!sum.value.trim()) {
        var p = Array.prototype.slice.call(tmp.querySelectorAll('p')).map(function(x){ return x.textContent.trim(); }).filter(function(x){ return x.length > 40; })[0];
        if (p) { sum.value = p.length > 237 ? p.slice(0, 236).replace(/\s+\S*$/, '') + '…' : p; upd(); }
      }
    }
  });

  var photos = document.getElementById('photos'), fileIn = document.getElementById('fileIn');
  function drawPhotos(){
    var html = images.map(function(u, i){
      return '<div class="ph"><img src="' + esc(u) + '" alt="Foto ' + (i + 1) + '">' + (i === 0 ? '<span class="cover">Sampul</span>' : '') +
        '<div class="tools"><span style="display:flex;gap:4px"><button type="button" data-mv="' + i + '" data-d="-1" ' + (i === 0 ? 'disabled' : '') + ' aria-label="Geser ke kiri">' + ic('left') + '</button>' +
        '<button type="button" data-mv="' + i + '" data-d="1" ' + (i === images.length - 1 ? 'disabled' : '') + ' aria-label="Geser ke kanan">' + ic('right') + '</button></span>' +
        '<button type="button" class="rm" data-rm="' + i + '" aria-label="Hapus foto">' + ic('x') + '</button></div></div>';
    }).join('');
    for (var k = 0; k < uploading; k++) html += '<div class="ph busy"></div>';
    if (images.length + uploading < 4) html += '<button type="button" class="ph add" id="addPh">' + ic('img') + '<br>Tambah foto<br><span style="font-weight:500;color:var(--muted)">' + (images.length + uploading) + '/4</span></button>';
    photos.innerHTML = html;
    var add = document.getElementById('addPh'); if (add) add.onclick = function(){ fileIn.click(); };
    photos.querySelectorAll('[data-rm]').forEach(function(b){ b.onclick = function(){ images.splice(Number(b.dataset.rm), 1); drawPhotos(); }; });
    photos.querySelectorAll('[data-mv]').forEach(function(b){ b.onclick = function(){ var i = Number(b.dataset.mv), j = i + Number(b.dataset.d); var t = images[i]; images[i] = images[j]; images[j] = t; drawPhotos(); }; });
  }
  drawPhotos();
  fileIn.onchange = function(){
    var files = Array.prototype.slice.call(fileIn.files || []).slice(0, 4 - images.length - uploading);
    fileIn.value = '';
    files.forEach(function(f){
      uploading++; drawPhotos();
      uploadFile(f).then(function(url){ images.push(url); })
        .catch(function(x){ if (x.message !== '401') toast('Gagal mengunggah ' + f.name + ': ' + x.message); })
        .then(function(){ uploading--; drawPhotos(); });
    });
  };

  document.getElementById('cForm').onsubmit = function(e){
    e.preventDefault();
    var err = document.getElementById('cErr'), btn = document.getElementById('save');
    err.hidden = true;
    if (uploading || editor.isBusy()) return showErr(err, 'Tunggu sampai semua foto selesai diunggah.');
    var data = {
      id: c.id || 0,
      title: document.getElementById('cTitle').value.trim(),
      category: document.getElementById('cCat').value,
      sort: Number(document.getElementById('cSort').value) || 0,
      summary: sum.value.trim(),
      story_html: editor.getHtml(),
      target: num(document.getElementById('cTarget').value),
      deadline: document.getElementById('cDead').value || null,
      visible: document.getElementById('cVis').checked,
      images: images
    };
    if (data.title.length < 5) return showErr(err, 'Judul minimal 5 karakter.');
    if (data.summary.length < 10) return showErr(err, 'Deskripsi singkat minimal 10 karakter.');
    if (!data.images.length) return showErr(err, 'Tambahkan minimal 1 foto banner.');
    if (!data.target) return showErr(err, 'Isi target dana.');
    busy(btn, true, 'Menyimpan…');
    api('admin', 'campaign-save', { body: data }).then(function(d){
      if (!c.id) { toast('Campaign tersimpan. Sekarang Anda bisa mencatat donasi & kabar.'); go('edit', d.campaign.id); return; }
      toast(data.visible ? 'Tersimpan & tampil di website' : 'Tersimpan (disembunyikan)');
      busy(btn, false);
      Object.assign(c, d.campaign);
    }).catch(function(x){ busy(btn, false); if (x.message !== '401') showErr(err, x.message); });
  };

  if (!c.id) return;
  function counts(){
    v.querySelector('[data-cnt="donasi"]').textContent = c.donations.length ? ' (' + c.donations.length + ')' : '';
    v.querySelector('[data-cnt="kabar"]').textContent = c.updates.length ? ' (' + c.updates.length + ')' : '';
    v.querySelector('[data-cnt="cair"]').textContent = c.disbursements.length ? ' (' + c.disbursements.length + ')' : '';
  }
  function refresh(d){ Object.assign(c, d.campaign); counts(); renderTab(tab); }
  function showTab(t){
    tab = t;
    v.querySelectorAll('.etab').forEach(function(b){ var on = b.dataset.tab === t; b.classList.toggle('on', on); b.setAttribute('aria-selected', on); });
    v.querySelectorAll('[data-panel]').forEach(function(p){ p.hidden = p.dataset.panel !== t; });
    renderTab(t);
  }
  function renderTab(t){
    var p = v.querySelector('[data-panel="' + t + '"]');
    if (t === 'donasi') panelDonations(p, c, refresh);
    if (t === 'kabar') panelUpdates(p, c, refresh);
    if (t === 'cair') panelDisb(p, c, refresh);
  }
  v.querySelectorAll('.etab').forEach(function(b){ b.onclick = function(){ showTab(b.dataset.tab); }; });
  counts(); showTab(tab);
}

    '<div class="acts"><button type="button" class="btn btn-ghost" data-close>Batal</button><button class="btn btn-primary" id="uBtn">Simpan</button></div></form>',

// Kecilkan foto di browser: sisi terpanjang maks 1600px, format WEBP/JPEG.
function compress(file){
  return new Promise(function(resolve, reject){
    if (!/^image\//.test(file.type)) return reject(new Error('File bukan gambar.'));
    if (file.size > 25 * 1024 * 1024) return reject(new Error('File terlalu besar (maks 25 MB).'));
    var img = new Image(), url = URL.createObjectURL(file);
    img.onload = function(){
      var max = 1600, w = img.naturalWidth, h = img.naturalHeight, s = Math.min(1, max / Math.max(w, h));
      var cv = document.createElement('canvas'); cv.width = Math.round(w * s); cv.height = Math.round(h * s);
      var cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height); cx.drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url);
      var out = cv.toDataURL('image/webp', 0.82);
      if (out.indexOf('data:image/webp') !== 0) out = cv.toDataURL('image/jpeg', 0.85);
      if (out.length > 3.9 * 1024 * 1024) out = cv.toDataURL('image/jpeg', 0.7);
      resolve(out);
    };
    img.onerror = function(){ URL.revokeObjectURL(url); reject(new Error('Gambar tidak bisa dibaca.')); };
    img.src = url;
  });
}

function viewAdmins(v){
  api('admin', 'admins').then(function(d){
    v.innerHTML = '<div class="head"><div><h1>Kelola Admin</h1><p>Admin bisa menambah admin lain dan mereset password admin lain yang lupa.</p></div>' +

      d.admins.map(function(a){
        var self = a.id === d.meId;
        return '<tr data-id="' + a.id + '" data-u="' + esc(a.username) + '"><td><b>' + esc(a.name) + '</b>' + (self ? ' <span class="tag">Anda</span>' : '') + '</td><td>' + esc(a.username) + '</td><td>' + fmtDate(a.last_login) + '</td>' +
          '<td><div class="acts">' + (self ? '<button class="btn btn-ghost btn-sm" data-goacc>Akun Saya</button>' :
          '<button class="btn btn-ghost btn-sm" data-reset>' + ic('key') + ' Reset Password</button><button class="btn btn-danger btn-sm" data-delA>' + ic('trash') + ' Hapus</button>') + '</div></td></tr>';
      }).join('') + '</tbody></table></div>';
    document.getElementById('addA').onclick = addAdmin;
    v.querySelectorAll('[data-goacc]').forEach(function(b){ b.onclick = function(){ go('account'); }; });
    v.querySelectorAll('[data-reset]').forEach(function(b){ b.onclick = function(){
      var tr = b.closest('tr'), u = tr.dataset.u;
      confirmBox('Reset password ' + u + '?', 'Password dan Kode Pemulihan lama milik ' + u + ' tidak berlaku lagi. Anda akan mendapat password sementara untuk diberikan kepadanya.', 'Ya, reset').then(function(yes){
        if (!yes) return;
        api('admin', 'admin-reset', { body: { id: Number(tr.dataset.id) } }).then(function(r){
          secretBox('Password baru untuk ' + r.username, 'Berikan data ini kepada <b>' + esc(r.username) + '</b> secara pribadi. Sarankan ia segera mengganti password di menu Akun Saya.',
            [{ label: 'Password sementara', value: r.password }, { label: 'Kode Pemulihan', value: r.recoveryCode }]);
        }).catch(function(x){ if (x.message !== '401') toast(x.message); });
      });
    }; });
    v.querySelectorAll('[data-delA]').forEach(function(b){ b.onclick = function(){
      var tr = b.closest('tr');
      confirmBox('Hapus admin ' + tr.dataset.u + '?', 'Admin ini tidak akan bisa login lagi.', 'Ya, hapus', true).then(function(yes){
        if (!yes) return;
        api('admin', 'admin-delete', { body: { id: Number(tr.dataset.id) } }).then(function(){ toast('Admin dihapus'); go('admins'); })
          .catch(function(x){ if (x.message !== '401') toast(x.message); });
      });
    }; });
  }).catch(function(x){ if (x.message !== '401') viewError(v, x.message); });
}
function addAdmin(){
  modal('<h2>Tambah Admin</h2><form id="aForm" novalidate>' +
    '<label class="lbl" for="aName">Nama</label><input class="field" id="aName" placeholder="Contoh: Dela Trinengsih">' +

    '<label class="lbl" for="aPass">Password</label>' + pwField('aPass', 'Minimal 8 karakter', 'new-password') +
    '<div id="aErr" class="alert err" hidden></div>' +
    '<div class="acts"><button type="button" class="btn btn-ghost" data-close>Batal</button><button class="btn btn-primary" id="aBtn">Tambah</button></div></form>',
    function(box, close){
      bindEyes(box);
      box.querySelector('#aForm').onsubmit = function(e){
        e.preventDefault();
        var err = box.querySelector('#aErr'), btn = box.querySelector('#aBtn');
        var data = { name: box.querySelector('#aName').value.trim(), username: box.querySelector('#aUser').value.trim().toLowerCase(), password: box.querySelector('#aPass').value };

        api('admin', 'admin-create', { body: data }).then(function(r){
          close(); go('admins');

        }).catch(function(x){ busy(btn, false); if (x.message !== '401') showErr(err, x.message); });
      };
    });
}

  bindEyes(v);
  document.getElementById('pForm').onsubmit = function(e){
    e.preventDefault();
    var msg = document.getElementById('pMsg'), btn = document.getElementById('pBtn');
    var cur = document.getElementById('pCur').value, n = document.getElementById('pNew').value, n2 = document.getElementById('pNew2').value;
    if (!cur) return showErr(msg, 'Isi password saat ini.');
    if (n.length < 8) return showErr(msg, 'Password baru minimal 8 karakter.');
    if (n !== n2) return showErr(msg, 'Ulangi password tidak sama.');
    busy(btn, true);
    api('admin', 'change-password', { body: { current: cur, newPassword: n } }).then(function(){
      busy(btn, false); e.target.reset(); msg.className = 'alert ok'; msg.textContent = 'Password berhasil diganti.'; msg.hidden = false;
    }).catch(function(x){ busy(btn, false); if (x.message !== '401') showErr(msg, x.message); });
  };
  document.getElementById('rForm').onsubmit = function(e){
    e.preventDefault();
    var msg = document.getElementById('rMsg'), btn = document.getElementById('rBtn'), cur = document.getElementById('rCur').value;
    if (!cur) return showErr(msg, 'Isi password saat ini.');
    busy(btn, true);
    api('admin', 'new-recovery', { body: { current: cur } }).then(function(r){
      busy(btn, false); e.target.reset(); msg.hidden = true;
      secretBox('Kode Pemulihan Baru', 'Kode lama sudah tidak berlaku. Ini kode pemulihan Anda yang baru:', [{ label: 'Kode Pemulihan', value: r.recoveryCode }]);
    }).catch(function(x){ busy(btn, false); if (x.message !== '401') showErr(msg, x.message); });
  };
}
